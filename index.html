<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      首帧前定主题，避免闪烁。与 src/shared/theme/store.ts 的 persist 格式和
      resolveTheme 逻辑是**两份手写同步**，改任一边要带上另一边。
      解析失败静默回退深色（无 data-theme 时的 CSS 默认值）。
    -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('bgtools:theme') || '{}').state || {}
        // v0 落盘格式里墨水屏是独立的 eink 开关，读取时兼容（store 侧靠 persist migrate 转正）
        var theme = s.eink === 'on' ? 'eink' : s.theme || 'system'
        if (theme === 'eink') {
          document.documentElement.dataset.theme = 'eink'
        } else if (
          theme === 'light' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
        ) {
          document.documentElement.dataset.theme = 'light'
        }
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- viewport-fit=cover 让页面铺满刘海屏，配合 safe-area-inset-* 避让 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>桌游工具箱</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
