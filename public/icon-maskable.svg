<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- maskable:不留圆角(遮罩自己裁),图形缩进 80% 安全区内 -->
  <style>
    .badge { fill: #0b0f17 }
    .arc { stroke: #fbbf24 }
    .pip { fill: #0b0f17 }
    .die-a { stop-color: #fde68a }
    .die-b { stop-color: #f59e0b }
    @media (prefers-color-scheme: light) {
      .badge { fill: #f5f2ea }
      .arc { stroke: #c2410c }
      .pip { fill: #fffbeb }
      .die-a { stop-color: #fbbf24 }
      .die-b { stop-color: #c2410c }
    }
  </style>
  <defs>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1">
      <stop class="die-a" offset="0" />
      <stop class="die-b" offset="1" />
    </linearGradient>
  </defs>
  <rect class="badge" width="512" height="512" />
  <g transform="translate(51 51) scale(0.8) translate(-5 -2)">
    <g class="arc" fill="none" stroke-linecap="round" stroke-width="14">
      <path d="M150 168a140 140 0 0 0 0 176" opacity="0.35" />
      <path d="M102 200a100 100 0 0 0 0 112" opacity="0.2" />
    </g>
    <g transform="rotate(-18 300 258)">
      <rect x="184" y="142" width="232" height="232" rx="50" fill="url(#die)" />
      <ellipse cx="246" cy="192" rx="58" ry="22" fill="#ffffff" opacity="0.2" />
      <g class="pip">
        <circle cx="232" cy="190" r="24" />
        <circle cx="300" cy="258" r="24" />
        <circle cx="368" cy="326" r="24" />
      </g>
    </g>
  </g>
</svg>
